<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#17304f">
<title>TOYOTENGO · Conteo de inventario</title>
<style>body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eef1f4;color:#17304f}
.c{max-width:420px;margin:30vh auto 0;text-align:center;padding:0 16px}.m{color:#5b6773;font-size:14px;margin-top:10px}
button{margin-top:16px;padding:12px 20px;font-size:16px;border:0;border-radius:8px;background:#17304f;color:#fff}</style>
</head><body>
<div class="c"><b>TOYOTENGO · Conteo de inventario</b><div class="m" id="m">Cargando la última versión…</div></div>
<script>
/* Esta página solo trae el programa de conteo desde Google (la misma hoja del generador de etiquetas).
   Así cualquier mejora que se publique en Google llega sola a todos los teléfonos.
   Está aquí, fuera de Google, porque Google no permite la cámara en vivo dentro de sus páginas. */
var API = "https://script.google.com/macros/s/AKfycbwLVTUqb1lVFx_sa6B12iL6Luk1na_SZUJtQ1WbaBM88r55Gl_KAuayMM3Fvyh0rAql/exec";
var GUARDADA = "toyo_conteo_html";
function poner(h){
  h = h.replace(/<head>/i, "<head><script>window.TOYO_API=" + JSON.stringify(API) + ";<\/script>");
  document.open(); document.write(h); document.close();
}
function cargar(){
  var vieja = null; try{ vieja = localStorage.getItem(GUARDADA); }catch(e){}
  var listo = false, t = setTimeout(function(){ if (!listo && vieja){ listo = true; poner(vieja); } }, 15000);
  fetch(API + "?p=fuente&t=" + Date.now(), {cache:"no-store"})
    .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
    .then(function(h){
      if (h.indexOf("TOYOTENGO") < 0 || h.indexOf("</html>") < 0) throw new Error("respuesta inesperada");
      try{ localStorage.setItem(GUARDADA, h); }catch(e){}
      if (!listo){ listo = true; clearTimeout(t); poner(h); }
    })
    .catch(function(err){
      if (listo) return; clearTimeout(t);
      if (vieja){ listo = true; poner(vieja); return; }
      document.getElementById("m").innerHTML = "No se pudo cargar (" + String(err.message || err) + "). Revise la conexión a internet.<br><button onclick=\"location.reload()\">Reintentar</button>";
    });
}
cargar();
</script>
</body></html>
